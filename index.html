<!doctype html>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="shortcut icon" type="image/x-icon" href="./src/images/logo.ico" />
    <title>Kritica & Ashish — The Corbett Wedding</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050806; }
      body { min-height: 100vh; color: #efe5ce; }
      .boot-note { min-height: 100vh; display: grid; place-items: center; font: 16px Georgia, serif; color: #caa566; letter-spacing: .08em; }
    </style>
    <script>
      window.__loadWeddingFallback = function () {
        if (window.__weddingFallbackLoading || window.__branchFallbackMounted) return;
        window.__weddingFallbackLoading = true;

        var root = document.getElementById('root');
        if (root && !root.childElementCount) root.innerHTML = '<div class="boot-note">OPENING THE CORBETT WEDDING…</div>';

        ['./src/styles.css', './src/audit-hardening.css', './src/precision-opening.css', './src/sylva-kinetic.css', './src/production-assets.css', './src/final-polish.css', './src/family-details.css', './src/logo-branding.css', './src/designer-credit.css', './src/typography.css', './src/design-system/opening-side.css', './src/design-system/language-selection.css', './src/design-system/forest-cinematic.css', './src/design-system/tiger-reveal.css', './src/design-system/tiger-crest-transition.css', './src/design-system/physical-passport.css', './src/design-system/couple-editorial-hero.css', './src/design-system/family-introduction.css', './src/design-system/couple-story.css', './src/design-system/corbett-destination.css', './src/design-system/itinerary-navigator.css'].forEach(function (href) {
          if (document.querySelector('link[data-fallback-style="' + href + '"]')) return;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.setAttribute('data-fallback-style', href);
          document.head.appendChild(link);
        });

        ['./src/cinematicEnhancements.js', './src/sylvaKinetic.js', './src/rsvpScrollGuard.js', './src/familyDetails.js', './src/logoBranding.js', './src/designerCredit.js', './src/design-system/openingSide.js', './src/design-system/languageSelection.js', './src/design-system/forestCinematic.js', './src/design-system/tigerReveal.js', './src/design-system/tigerCrestTransition.js', './src/design-system/physicalPassport.js', './src/design-system/coupleEditorialHero.js', './src/design-system/familyIntroduction.js', './src/design-system/coupleStory.js', './src/design-system/corbettDestination.js', './src/design-system/itineraryNavigator.js'].forEach(function (src) {
          var motion = document.createElement('script');
          motion.type = 'module';
          motion.src = src;
          document.body.appendChild(motion);
        });

        var script = document.createElement('script');
        script.type = 'module';
        script.src = './src/branchFallback.js';
        script.onerror = function () {
          if (root) root.innerHTML = '<div class="boot-note">THE INVITATION COULD NOT LOAD. PLEASE REFRESH.</div>';
        };
        document.body.appendChild(script);
      };

      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.childElementCount) window.__loadWeddingFallback();
      }, 5000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx" onerror="window.__loadWeddingFallback()"></script>
  </body>
</html>
